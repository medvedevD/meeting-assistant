name: Release

on:
  push:
    # TEMP: CI iteration on the rewrite branch — remove before merge to main.
    branches:
      - feat/compose-desktop-rewrite
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gradle_task: packageReleaseDeb
            artifact_pattern: ui-compose/desktopApp/build/compose/binaries/main-release/deb/*.deb
            artifact_name: meeting-assistant-linux.deb
            lib_src: rust/target/release/libmeeting_assistant_ffi.so
            lib_dst: ui-compose/desktopApp/resources/linux/libmeeting_assistant_ffi.so

          - os: macos-latest
            gradle_task: packageReleaseDmg
            artifact_pattern: ui-compose/desktopApp/build/compose/binaries/main-release/dmg/*.dmg
            artifact_name: meeting-assistant-macos.dmg
            lib_src: rust/target/release/libmeeting_assistant_ffi.dylib
            lib_dst: ui-compose/desktopApp/resources/macos/libmeeting_assistant_ffi.dylib

          - os: windows-latest
            gradle_task: packageReleaseMsi
            artifact_pattern: ui-compose/desktopApp/build/compose/binaries/main-release/msi/*.msi
            artifact_name: meeting-assistant-windows.msi
            lib_src: rust/target/release/meeting_assistant_ffi.dll
            lib_dst: ui-compose/desktopApp/resources/windows/meeting_assistant_ffi.dll

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # ALSA headers required on Linux (cpal dependency, pulled in via meeting-adapters)
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libasound2-dev pkg-config

      # WiX Toolset required for MSI packaging — not pre-installed on windows-latest
      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        run: choco install wixtoolset --version 3.14.1 -y
        shell: pwsh

      # Build only the FFI crate (faster, avoids unneeded workspace members)
      - name: Build Rust FFI
        shell: bash
        run: cargo build --release -p ffi --manifest-path rust/Cargo.toml

      - name: Copy native library to resources
        shell: bash
        run: |
          mkdir -p "$(dirname "${{ matrix.lib_dst }}")"
          cp "${{ matrix.lib_src }}" "${{ matrix.lib_dst }}"

      - name: Package (Gradle)
        shell: bash
        run: |
          cd ui-compose
          ./gradlew :desktopApp:${{ matrix.gradle_task }} \
            -Drust.target.dir=../rust/target/release

      - name: Find artifact path
        id: artifact
        shell: bash
        run: |
          FILE=$(ls ${{ matrix.artifact_pattern }} 2>/dev/null | head -1)
          echo "path=$FILE" >> $GITHUB_OUTPUT

      - name: Upload artifact to workflow
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.artifact.outputs.path }}

      - name: Upload to GitHub Release (draft)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.path }}
          name: Meeting Assistant ${{ github.ref_name }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # macOS codesign/notarization — отложено до получения Apple Developer ID
      # Раскомментировать когда будет APPLE_SIGNING_IDENTITY secret:
      #
      # - name: Sign DMG (macOS)
      #   if: runner.os == 'macOS'
      #   run: |
      #     codesign --deep --force --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" \
      #       "${{ steps.artifact.outputs.path }}"
      #   env:
      #     APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
