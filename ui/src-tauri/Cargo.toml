[package]
name = "meeting-assistant-tauri"
version = "0.1.0"
edition = "2021"

[lib]
name = "meeting_assistant_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "meeting-assistant-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
meeting-core = { path = "../../rust/crates/core" }
meeting-adapters = { path = "../../rust/crates/adapters" }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
cpal = "0.15"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-store = "2"
