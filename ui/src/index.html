<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 24px;
      padding: 32px;
    }
    h1 { font-size: 1.5rem; font-weight: 600; }
    .card {
      background: #16213e;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    label { font-size: 0.875rem; color: #a0a0b0; }
    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #2a2a4a;
      background: #0f3460;
      color: #e0e0e0;
      font-size: 0.95rem;
    }
    button {
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      background: #e94560;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #c73652; }
    button:disabled { background: #555; cursor: not-allowed; }
    #result {
      white-space: pre-wrap;
      font-size: 0.875rem;
      line-height: 1.6;
      color: #c0c0d0;
      min-height: 80px;
      background: #0a0a1a;
      border-radius: 8px;
      padding: 12px;
      display: none;
    }
    #status { font-size: 0.85rem; color: #888; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Meeting Assistant</h1>
  <div class="card">
    <label for="filepath">Путь к аудиофайлу (WAV)</label>
    <input type="text" id="filepath" placeholder="/home/user/recording.wav" />
    <button id="btn-transcribe" onclick="transcribe()">Транскрибировать файл</button>
    <div id="status"></div>
    <div id="result"></div>
  </div>

  <script type="module">
    import { invoke } from "@tauri-apps/api/core";

    window.transcribe = async function () {
      const path = document.getElementById("filepath").value.trim();
      if (!path) return;

      const btn = document.getElementById("btn-transcribe");
      const status = document.getElementById("status");
      const result = document.getElementById("result");

      btn.disabled = true;
      status.textContent = "Транскрибирование…";
      result.style.display = "none";

      try {
        const text = await invoke("transcribe_file", { path });
        result.textContent = text;
        result.style.display = "block";
        status.textContent = "Готово.";
      } catch (e) {
        status.textContent = "Ошибка: " + e;
      } finally {
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
