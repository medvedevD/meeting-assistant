<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    h1 { font-size: 1.5rem; font-weight: 600; }
    h2 { font-size: 1rem; font-weight: 600; color: #a0a0c0; margin-bottom: 8px; }
    .card {
      background: #16213e;
      border-radius: 12px;
      padding: 24px 32px;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    label { font-size: 0.875rem; color: #a0a0b0; }
    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #2a2a4a;
      background: #0f3460;
      color: #e0e0e0;
      font-size: 0.95rem;
    }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      flex: 1;
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      background: #e94560;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      min-width: 120px;
    }
    button:hover { background: #c73652; }
    button:disabled { background: #444; cursor: not-allowed; }
    button.secondary { background: #2a4080; }
    button.secondary:hover { background: #1e3060; }
    button.danger { background: #c0392b; }
    button.danger:hover { background: #962d23; }
    #status { font-size: 0.85rem; color: #888; min-height: 1.2em; }
    #recording-badge {
      display: none;
      background: #c0392b;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.05em;
      align-self: flex-start;
    }
    #recording-badge.visible { display: inline-block; }
    #result {
      white-space: pre-wrap;
      font-size: 0.875rem;
      line-height: 1.6;
      color: #c0c0d0;
      background: #0a0a1a;
      border-radius: 8px;
      padding: 12px;
      display: none;
    }
    /* meetings list */
    #meetings-list { display: flex; flex-direction: column; gap: 8px; }
    .meeting-item {
      background: #0f2040;
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.875rem;
    }
    .meeting-name { flex: 1; font-weight: 500; }
    .meeting-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      background: #1a3a1a;
      color: #4caf50;
    }
    .meeting-badge.no { background: #2a2a2a; color: #666; }
    .meeting-path { font-size: 0.75rem; color: #606080; word-break: break-all; }
    #meetings-empty { color: #666; font-size: 0.875rem; text-align: center; padding: 12px; }
  </style>
</head>
<body>
  <h1>Meeting Assistant</h1>

  <!-- ── Recording ── -->
  <div class="card" id="card-record">
    <h2>Запись встречи</h2>
    <label for="meeting-name">Название встречи (необязательно)</label>
    <input type="text" id="meeting-name" placeholder="Например: 1-на-1 с Дионом" />
    <span id="recording-badge">● REC</span>
    <div id="active-id" style="font-size:0.8rem;color:#888;display:none;"></div>
    <div class="btn-row">
      <button id="btn-start" onclick="recordStart()">▶ Начать запись</button>
      <button id="btn-stop" class="danger" onclick="recordStop()" disabled>■ Остановить</button>
    </div>
    <div id="status"></div>
  </div>

  <!-- ── Transcribe file ── -->
  <div class="card">
    <h2>Транскрибировать файл</h2>
    <label for="filepath">Путь к аудиофайлу (WAV)</label>
    <input type="text" id="filepath" placeholder="/home/user/recording.wav" />
    <button id="btn-transcribe" onclick="transcribeFile()">Транскрибировать</button>
    <div id="transcribe-status" style="font-size:0.85rem;color:#888;min-height:1.2em;"></div>
    <div id="result"></div>
  </div>

  <!-- ── Meetings list ── -->
  <div class="card">
    <h2>
      Встречи
      <button class="secondary" onclick="loadMeetings()"
        style="font-size:0.75rem;padding:4px 12px;margin-left:12px;min-width:auto;flex:none;">
        Обновить
      </button>
    </h2>
    <div id="meetings-list">
      <div id="meetings-empty">Загрузка…</div>
    </div>
  </div>

  <script>
    // invoke is injected by Tauri via withGlobalTauri: true
    function invoke(cmd, args) {
      return window.__TAURI__.core.invoke(cmd, args);
    }

    let activeRecordingId = null;

    // ── recording ──────────────────────────────────────────────────────────

    window.recordStart = async function () {
      const name = document.getElementById("meeting-name").value.trim() || undefined;
      const status = document.getElementById("status");
      const btnStart = document.getElementById("btn-start");
      const btnStop  = document.getElementById("btn-stop");

      btnStart.disabled = true;
      status.textContent = "Запуск записи…";

      try {
        const dto = await invoke("recording_start", { name });
        activeRecordingId = dto.id;

        document.getElementById("recording-badge").classList.add("visible");
        const activeEl = document.getElementById("active-id");
        activeEl.textContent = "ID: " + dto.id;
        activeEl.style.display = "block";

        btnStop.disabled = false;
        status.textContent = "Запись идёт: " + dto.name;
      } catch (e) {
        status.textContent = "Ошибка: " + e;
        btnStart.disabled = false;
      }
    };

    window.recordStop = async function () {
      if (!activeRecordingId) return;
      const status = document.getElementById("status");
      const btnStart = document.getElementById("btn-start");
      const btnStop  = document.getElementById("btn-stop");

      btnStop.disabled = true;
      status.textContent = "Остановка…";

      try {
        const dto = await invoke("recording_stop", { id: activeRecordingId });
        activeRecordingId = null;

        document.getElementById("recording-badge").classList.remove("visible");
        document.getElementById("active-id").style.display = "none";

        btnStart.disabled = false;
        status.textContent = "Записано: " + dto.audio_path;
        await loadMeetings();
      } catch (e) {
        status.textContent = "Ошибка при остановке: " + e;
        btnStop.disabled = false;
      }
    };

    // ── transcribe file ────────────────────────────────────────────────────

    window.transcribeFile = async function () {
      const path = document.getElementById("filepath").value.trim();
      if (!path) return;

      const btn    = document.getElementById("btn-transcribe");
      const status = document.getElementById("transcribe-status");
      const result = document.getElementById("result");

      btn.disabled = true;
      status.textContent = "Транскрибирование…";
      result.style.display = "none";

      try {
        const text = await invoke("transcribe_file", { path });
        result.textContent = text;
        result.style.display = "block";
        status.textContent = "Готово.";
      } catch (e) {
        status.textContent = "Ошибка: " + e;
      } finally {
        btn.disabled = false;
      }
    };

    // ── meetings list ──────────────────────────────────────────────────────

    window.loadMeetings = async function () {
      const container = document.getElementById("meetings-list");
      const empty     = document.getElementById("meetings-empty");
      try {
        const meetings = await invoke("meetings_list");
        container.innerHTML = "";
        if (meetings.length === 0) {
          empty.textContent = "Встреч пока нет.";
          container.appendChild(empty);
          return;
        }
        for (const m of meetings) {
          const item = document.createElement("div");
          item.className = "meeting-item";

          const nameEl = document.createElement("div");
          nameEl.className = "meeting-name";
          nameEl.textContent = m.name;

          const badge = document.createElement("span");
          badge.className = "meeting-badge" + (m.has_transcript ? "" : " no");
          badge.textContent = m.has_transcript ? "транскрипт ✓" : "без транскрипта";

          const pathEl = document.createElement("div");
          pathEl.className = "meeting-path";
          pathEl.textContent = m.audio_path;

          const info = document.createElement("div");
          info.style.flex = "1";
          info.appendChild(nameEl);
          info.appendChild(pathEl);

          item.appendChild(info);
          item.appendChild(badge);
          container.appendChild(item);
        }
      } catch (e) {
        empty.textContent = "Ошибка загрузки: " + e;
        container.innerHTML = "";
        container.appendChild(empty);
      }
    };

    // load on start
    loadMeetings();
  </script>
</body>
</html>
