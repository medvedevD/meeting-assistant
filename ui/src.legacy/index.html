<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Assistant</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div style="display:flex;align-items:center;justify-content:space-between;width:100%;max-width:600px;">
    <h1>Meeting Assistant</h1>
    <button id="btn-diagnostics" class="secondary"
      style="font-size:0.75rem;padding:4px 12px;min-width:auto;flex:none;"
      title="Ctrl+Shift+D">Диагностика</button>
  </div>

  <!-- ── Recording ── -->
  <div class="card" id="card-record">
    <h2>Запись встречи</h2>
    <label for="meeting-name">Название встречи (необязательно)</label>
    <input type="text" id="meeting-name" placeholder="Например: 1-на-1 с Дионом" />
    <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;">
      <div style="display:flex;flex-direction:column;gap:4px;">
        <label for="rec-source">Источник аудио</label>
        <select id="rec-source">
          <option value="mic">Микрофон</option>
          <option value="system">Системный аудио</option>
          <option value="mixed">Микс (микрофон + система)</option>
        </select>
      </div>
      <div id="echo-cancel-row" style="display:none;align-items:center;gap:8px;padding-top:18px;">
        <input type="checkbox" id="rec-echo-cancel" style="width:16px;height:16px;cursor:pointer;" />
        <label for="rec-echo-cancel" style="cursor:pointer;">Эхоподавление</label>
      </div>
    </div>
    <span id="recording-badge">● REC</span>
    <div id="active-id" style="font-size:0.8rem;color:#888;display:none;"></div>
    <div class="btn-row">
      <button id="btn-start">▶ Начать запись</button>
      <button id="btn-stop" class="danger" disabled>■ Остановить</button>
    </div>
    <div id="rec-status" class="status-line"></div>
  </div>

  <!-- ── Transcribe file ── -->
  <div class="card">
    <h2>Транскрибировать файл</h2>
    <label for="filepath">Путь к аудиофайлу (WAV)</label>
    <input type="text" id="filepath" placeholder="/home/user/recording.wav" />
    <button id="btn-transcribe">Транскрибировать</button>
    <div id="transcribe-status" class="status-line"></div>
    <div id="result"></div>
  </div>

  <!-- ── Meetings list ── -->
  <div class="card">
    <h2>
      Встречи
      <button id="btn-refresh-meetings" class="secondary"
        style="font-size:0.75rem;padding:4px 12px;margin-left:12px;min-width:auto;flex:none;">
        Обновить
      </button>
    </h2>
    <div id="meetings-list">
      <div id="meetings-empty">Загрузка…</div>
    </div>
  </div>

  <!-- ── Settings ── -->
  <div class="card" id="card-settings">
    <h2>Настройки</h2>

    <div class="settings-field">
      <label for="settings-model">Модель Whisper (.bin)</label>
      <div class="settings-input-row">
        <input type="text" id="settings-model" placeholder="загрузка…" />
        <span class="path-indicator" id="ind-model"></span>
      </div>
    </div>

    <div class="settings-field">
      <label for="settings-db">База данных (SQLite)</label>
      <div class="settings-input-row">
        <input type="text" id="settings-db" placeholder="загрузка…" />
        <span class="path-indicator" id="ind-db"></span>
      </div>
    </div>

    <div class="settings-field">
      <label for="settings-recordings">Папка записей</label>
      <div class="settings-input-row">
        <input type="text" id="settings-recordings" placeholder="загрузка…" />
        <span class="path-indicator" id="ind-recordings"></span>
      </div>
    </div>

    <div class="settings-field">
      <label for="settings-prompts">Папка шаблонов</label>
      <div class="settings-input-row">
        <input type="text" id="settings-prompts" placeholder="загрузка…" />
        <span class="path-indicator" id="ind-prompts"></span>
      </div>
    </div>

    <div class="settings-field">
      <label for="settings-api-key">Anthropic API Key</label>
      <input type="password" id="settings-api-key" placeholder="sk-ant-… (оставьте пустым, чтобы не менять)" />
    </div>

    <div class="btn-row">
      <button id="btn-settings-save">Сохранить</button>
      <button id="btn-settings-reset" class="secondary">Сбросить к default</button>
    </div>
    <div id="settings-status" class="status-line"></div>
  </div>

  <!-- ── Protocol modal ── -->
  <div id="protocol-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-title">Протокол встречи</h2>
        <button id="btn-modal-close" class="secondary"
          style="flex:none;min-width:auto;padding:4px 12px;font-size:0.85rem;">✕</button>
      </div>
      <div style="display:flex;gap:10px;align-items:center;">
        <label for="modal-template" style="white-space:nowrap;">Шаблон:</label>
        <select id="modal-template" style="flex:1;"></select>
        <button id="btn-modal-generate"
          style="flex:none;min-width:auto;padding:8px 16px;">Сгенерировать</button>
      </div>
      <div id="modal-status" class="status-line"></div>
      <div id="modal-result" class="modal-result"></div>
      <div id="modal-actions" style="display:none;">
        <button id="btn-modal-download" class="secondary"
          style="flex:none;min-width:auto;padding:8px 16px;">Скачать .md</button>
      </div>
    </div>
  </div>

  <div id="toast" style="
    display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:#333;color:#fff;padding:10px 20px;border-radius:8px;
    font-size:0.875rem;z-index:999;pointer-events:none;
  "></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
