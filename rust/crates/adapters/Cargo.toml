[package]
name = "meeting-adapters"
version = "0.1.0"
edition = "2021"

[dependencies]
meeting-core = { path = "../core" }
whisper-rs = "0.16"
hound = "3"
rubato = "0.15"
cpal = "0.15"
tokio = { workspace = true }
tokio-util = { workspace = true }
dashmap = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
num_cpus = "1"
uuid = { workspace = true }
rusqlite = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
# OS keyring for API secrets. Native backends are enabled per-target below;
# on platforms without a backend, KeyringSecretStore falls back to a 0600 file.
keyring = "3"

# macOS system-audio capture via ScreenCaptureKit (audio-only; macOS 13.0 floor).
# QtMultimedia/cpal cannot expose a macOS loopback device — see section-05.
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "=2.1.0", features = ["macos_13_0"] }
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
meeting-core = { path = "../core", features = ["fakes"] }
wiremock = { workspace = true }
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
