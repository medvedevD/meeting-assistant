[package]
name = "meeting-adapters"
version = "0.1.0"
edition = "2021"

[dependencies]
meeting-core = { path = "../core" }
whisper-rs = "0.16"
hound = "3"
rubato = "0.15"
cpal = "0.15"
tokio = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
num_cpus = "1"
uuid = { workspace = true }
rusqlite = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# macOS system-audio capture via ScreenCaptureKit (audio-only; macOS 13.0 floor).
# QtMultimedia/cpal cannot expose a macOS loopback device — see section-05.
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "=2.1.0", features = ["macos_13_0"] }

[dev-dependencies]
wiremock = { workspace = true }
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
