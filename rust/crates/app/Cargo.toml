[package]
name = "meeting-assistant"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "meeting-assistant"
path = "src/main.rs"

# Loopback-HTTP sidecar for the Qt GUI (section-02). Shares container.rs with
# the legacy CLI binary via a `#[path]` include (no lib target in this crate).
[[bin]]
name = "meeting-server"
path = "src/bin/meeting-server.rs"

[dependencies]
meeting-core = { path = "../core" }
meeting-adapters = { path = "../adapters" }
meeting-api = { path = "../api" }
tokio = { workspace = true }
dashmap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
axum = "0.7"
reqwest = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
getrandom = "0.2"
dirs = { workspace = true }
async-trait = { workspace = true }
sha1 = "0.10"
num_cpus = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading"] }

# Section-08 sidecar contract tests spawn the real `meeting-server` binary and
# talk to it over loopback HTTP.
[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
